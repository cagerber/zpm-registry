# Packages this repo provides, and the versions they carry.
#
# PATCH mode: this is a third-party FORK, so upstream's hand-written `module.xml` is
# authoritative. The coordinator stamps the version and forces the identity — it does not
# generate a manifest, because generating over an upstream one would diverge from it
# permanently and make every upstream merge painful.
#
# Note this module declares `<Dependencies>` (yaml-utils), which is deliberately kept: the
# registry reads `zpm-registry.yaml` through it.

schema: trifour-ipm-packages-v1

repo: cagerber/zpm-registry
versions: {release: "1.3.7", develop: "1.3.7", sprint: "1.3.7", incubating: "1.3.7"}

mode: patch

packages:
  - id: trifour-zpm-registry
    description: "Trifour's channel-aware fork of the ZPM registry"
